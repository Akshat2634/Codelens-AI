name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Lint (Biome)
        run: npm run lint

      - name: Syntax check all source files
        shell: bash
        run: |
          for f in src/*.js; do
            node --check "$f"
          done

      - name: Unit tests
        run: npm run test:unit

      - name: Verify CLI starts without error
        run: node src/index.js --json --claude-dir tests/fixtures/claude-projects --codex-dir tests/fixtures/codex-sessions --copilot-dir tests/fixtures/copilot-sessions --copilot-vscode-dir tests/fixtures/copilot-vscode --days 30

  package:
    # Exercise the packed tarball with production dependencies only so missing
    # vendored assets are caught before publishing.
    name: Package smoke test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package smoke test (pack, clean-install, serve)
        run: npm run test:package

  e2e:
    # Keep the fixture-backed Playwright suite on Ubuntu; cross-platform jobs
    # below cover the parser, server, and CLI without installing browsers.
    name: E2E smoke test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Smoke E2E (fixtures)
        env:
          CI: "1"
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  cross-platform:
    name: ${{ matrix.os }} smoke test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Verify CLI starts
        run: node src/index.js --help

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-1.0-only, AGPL-3.0-only

  required:
    name: CI Required
    if: always()
    runs-on: ubuntu-latest
    needs: [check, package, e2e, cross-platform, dependency-review]
    steps:
      - name: Confirm all required jobs passed
        if: >-
          needs.check.result != 'success' ||
          needs.package.result != 'success' ||
          needs.e2e.result != 'success' ||
          needs.cross-platform.result != 'success' ||
          (needs.dependency-review.result != 'success' && needs.dependency-review.result != 'skipped')
        run: exit 1

      - name: Mark CI gate successful
        run: echo "All required CI jobs passed."
